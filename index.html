<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Slate Pro - Cloud Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f1115;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
        }
        .slate-card {
            background: #1a1d23;
            border: 1px solid #2d333b;
            border-radius: 12px;
        }
        .btn-good { background-color: #059669; transition: all 0.2s; }
        .btn-good:hover { background-color: #10b981; transform: scale(1.02); }
        .btn-bad { background-color: #dc2626; transition: all 0.2s; }
        .btn-bad:hover { background-color: #ef4444; transform: scale(1.02); }
        
        .project-tab {
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }
        .project-tab.active {
            border-bottom-color: #eab308;
            color: #eab308;
            background: rgba(234, 179, 8, 0.05);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight flex items-center gap-3">
                    <span class="bg-yellow-500 text-black px-2 py-1 rounded">PRO</span> DIGITAL SLATE
                </h1>
                <p class="text-gray-500 text-sm uppercase tracking-widest mt-1">Gestión de Proyectos en la Nube</p>
            </div>
            <div class="text-right bg-black/30 p-3 rounded-lg border border-white/5">
                <div id="clock" class="text-2xl font-mono text-yellow-500">00:00:00</div>
                <p id="user-id-display" class="text-[10px] text-gray-500 font-mono mt-1">Cargando usuario...</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Sidebar: Proyectos -->
            <div class="lg:col-span-1 space-y-4">
                <div class="slate-card p-4">
                    <h2 class="text-xs font-bold text-gray-500 uppercase mb-4 tracking-tighter">Mis Proyectos</h2>
                    <div id="projectList" class="space-y-1 mb-4 max-h-64 overflow-y-auto">
                        <!-- Proyectos cargados aquí -->
                    </div>
                    <button onclick="createNewProject()" class="w-full py-2 border border-dashed border-gray-600 rounded text-xs text-gray-400 hover:border-yellow-500 hover:text-yellow-500 transition-colors">
                        + NUEVO PROYECTO
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="lg:col-span-3">
                <!-- Control Panel -->
                <div class="slate-card p-6 mb-8">
                    <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                        <h2 id="activeProjectTitle" class="text-xl font-bold text-white">Selecciona un proyecto</h2>
                        <span id="syncStatus" class="text-[10px] text-green-500 uppercase font-bold">● Sincronizado</span>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-tighter">Escena</label>
                            <input type="text" id="scene" value="01" class="w-full bg-black border border-gray-700 rounded p-3 text-white focus:border-yellow-500 outline-none text-center text-xl font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-tighter">Toma (Take)</label>
                            <div class="flex items-center space-x-2">
                                <button onclick="changeTake(-1)" class="bg-gray-800 px-3 py-2 rounded hover:bg-gray-700 text-xs">-</button>
                                <input type="number" id="take" value="1" class="w-full bg-black border border-gray-700 rounded p-3 text-white text-center text-xl font-bold outline-none">
                                <button onclick="changeTake(1)" class="bg-gray-800 px-3 py-2 rounded hover:bg-gray-700 text-xs">+</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-tighter">ID Clip (Cámara)</label>
                            <input type="text" id="clip" placeholder="C001" class="w-full bg-black border border-gray-700 rounded p-3 text-white focus:border-yellow-500 outline-none text-center text-xl font-bold uppercase">
                        </div>
                        <div class="col-span-2 md:col-span-1 flex items-end">
                             <button onclick="exportCSV()" class="w-full bg-gray-700 hover:bg-gray-600 text-white text-[10px] py-4 rounded font-bold uppercase leading-tight">
                                Descargar Reporte
                             </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-tighter">Notas de la Toma</label>
                        <textarea id="notes" placeholder="Describre la toma aquí..." class="w-full bg-black border border-gray-700 rounded p-3 text-white focus:border-yellow-500 outline-none h-20 resize-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mt-6">
                        <button onclick="logTake('BUENA')" class="btn-good py-6 rounded-xl text-white font-bold text-xl uppercase shadow-lg shadow-green-900/20">
                            Toma Buena
                        </button>
                        <button onclick="logTake('MALA')" class="btn-bad py-6 rounded-xl text-white font-bold text-xl uppercase shadow-lg shadow-red-900/20">
                            Toma Mala
                        </button>
                    </div>
                </div>

                <!-- Historial -->
                <div class="slate-card overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-black/50 text-gray-500 text-[10px] uppercase">
                                <tr>
                                    <th class="p-4">Hora</th>
                                    <th class="p-4">Escena</th>
                                    <th class="p-4">Toma</th>
                                    <th class="p-4">Clip</th>
                                    <th class="p-4">Estado</th>
                                    <th class="p-4">Notas</th>
                                    <th class="p-4 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="logBody" class="text-sm">
                                <!-- Datos de Firestore aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'prod-slate-app';

        let user = null;
        let activeProjectId = null;
        let currentLogs = [];

        // 1. Auth Init
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('user-id-display').innerText = `ID: ${user.uid}`;
                loadProjects();
            }
        });

        // 2. Proyectos
        window.loadProjects = () => {
            if (!user) return;
            const q = collection(db, 'artifacts', appId, 'users', user.uid, 'projects');
            onSnapshot(q, (snapshot) => {
                const projectList = document.getElementById('projectList');
                projectList.innerHTML = "";
                
                if (snapshot.empty && !activeProjectId) {
                    addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'projects'), {
                        name: "Proyecto Demo",
                        createdAt: serverTimestamp()
                    });
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const div = document.createElement('div');
                    div.className = `project-tab p-3 rounded text-sm ${activeProjectId === docSnap.id ? 'active' : ''}`;
                    div.innerText = data.name;
                    div.onclick = () => selectProject(docSnap.id, data.name);
                    projectList.appendChild(div);
                });
            }, (err) => console.error("Error cargando proyectos:", err));
        };

        window.createNewProject = async () => {
            const name = prompt("Nombre del nuevo proyecto:");
            if (name && user) {
                await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'projects'), {
                    name: name,
                    createdAt: serverTimestamp()
                });
            }
        };

        window.selectProject = (id, name) => {
            activeProjectId = id;
            document.getElementById('activeProjectTitle').innerText = name;
            loadLogs(id);
            loadProjects();
        };

        // 3. Notas (Logs)
        let unsubscribeLogs = null;
        function loadLogs(projectId) {
            if (unsubscribeLogs) unsubscribeLogs();
            
            const q = collection(db, 'artifacts', appId, 'users', user.uid, 'projects', projectId, 'logs');
            unsubscribeLogs = onSnapshot(q, (snapshot) => {
                currentLogs = [];
                snapshot.forEach(doc => currentLogs.push({id: doc.id, ...doc.data()}));
                currentLogs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                renderLogs();
            }, (err) => console.error("Error logs:", err));
        }

        window.logTake = async (status) => {
            if (!user || !activeProjectId) return;
            
            const scene = document.getElementById('scene').value;
            const take = document.getElementById('take').value;
            const clip = document.getElementById('clip').value;
            const notes = document.getElementById('notes').value;
            const time = new Date().toTimeString().split(' ')[0];

            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'projects', activeProjectId, 'logs'), {
                time,
                scene,
                take,
                clip,
                status,
                notes,
                timestamp: serverTimestamp()
            });

            document.getElementById('notes').value = "";
            document.getElementById('clip').value = ""; // Limpiar clip tras registrar
            changeTake(1);
        };

        window.deleteLog = async (logId) => {
            if (!user || !activeProjectId) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'projects', activeProjectId, 'logs', logId));
        };

        function renderLogs() {
            const body = document.getElementById('logBody');
            body.innerHTML = "";
            currentLogs.forEach((log) => {
                const row = document.createElement('tr');
                row.className = `border-b border-gray-800/50 hover:bg-white/5 transition-colors`;
                row.innerHTML = `
                    <td class="p-4 font-mono text-gray-500 text-xs">${log.time}</td>
                    <td class="p-4 font-bold text-white">${log.scene}</td>
                    <td class="p-4 text-gray-300">${log.take}</td>
                    <td class="p-4 text-yellow-500 font-mono text-xs font-bold">${log.clip || '-'}</td>
                    <td class="p-4">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${log.status === 'BUENA' ? 'bg-green-900/30 text-green-400' : 'bg-red-900/30 text-red-400'}">
                            ${log.status}
                        </span>
                    </td>
                    <td class="p-4 text-gray-400 italic text-xs">${log.notes || '-'}</td>
                    <td class="p-4 text-right">
                        <button onclick="deleteLog('${log.id}')" class="text-gray-700 hover:text-red-500 transition-colors">Eliminar</button>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        window.changeTake = (val) => {
            const takeInput = document.getElementById('take');
            let current = parseInt(takeInput.value);
            if (current + val > 0) takeInput.value = current + val;
        };

        window.exportCSV = () => {
            if (currentLogs.length === 0) return;
            let csv = "Time,Scene,Take,Clip,Status,Notes\n";
            currentLogs.forEach(l => csv += `${l.time},${l.scene},${l.take},${l.clip || ''},${l.status},"${l.notes}"\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `reporte_${document.getElementById('activeProjectTitle').innerText}.csv`;
            a.click();
        };

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
